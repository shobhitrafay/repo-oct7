apiVersion: infra.k8smgmt.io/v3
kind: Cluster
metadata:
  name: eks-tf
  project: defaultproject
spec:
  blueprintConfig:
    name: rishabh-latest-bp
    optionalAddons:
    - hello-addon
    - nginx-yaml
    version: v1
  cloudCredentials: shobhit_aws
  config:
    addons:
    - name: coredns
      version: latest
    - name: kube-proxy
      version: latest
    - name: vpc-cni
      version: latest
    - name: aws-ebs-csi-driver
      version: latest
    managedNodeGroups:
    - desiredCapacity: 2
      disableIMDSv1: false
      disablePodIMDS: false
      ebsOptimized: false
      efaEnabled: false
      enableDetailedMonitoring: false
      instanceType: t3.large
      maxSize: 3
      minSize: 1
      name: ng-1
      spot: false
      version: "1.35"
      volumeEncrypted: false
      volumeType: gp3
    metadata:
      name: eks-tf
      region: us-west-2
      version: "1.35"
    network:
      cni:
        name: aws-cni
    vpc:
      autoAllocateIPv6: false
      cidr: 192.168.0.0/16
      clusterEndpoints:
        privateAccess: true
        publicAccess: true
  type: aws-eks
