apiVersion: infra.k8smgmt.io/v3
kind: Cluster
metadata:
  name: rishabh-oci
  project: defaultproject
spec:
  blueprint:
    name: new-blueprint
    optionalAddons:
    - simple-addon
    version: v1
  config:
    autoApproveNodes: true
    installerTtl: 365
    kubernetesVersion: v1.35.8
    network:
      cni:
        name: Calico
        version: 3.32.2
      podSubnet: 10.244.0.0/16
      serviceSubnet: 10.96.0.0/12
    nodes:
    - arch: arm64
      hostname: rishabh-oci
      operatingSystem: Ubuntu22.04
      privateIP: 10.0.0.77
      roles:
      - ControlPlane
      - Worker
      ssh:
        ipAddress: 129.146.16.16
        port: "22"
        privateKeyPath: /Users/rishabh/Downloads/rishabh-oci.pem
        username: ubuntu
    ssh:
      port: "22"
      privateKeyPath: /Users/rishabh/Downloads/rishabh-oci.pem
      username: ubuntu
  type: mks
