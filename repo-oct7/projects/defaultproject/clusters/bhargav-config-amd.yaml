apiVersion: infra.k8smgmt.io/v3
kind: Cluster
metadata:
  labels:
    labels: ""
  name: bhargav-config-amd
  project: defaultproject
spec:
  blueprint:
    name: rishabh-latest-bp
    optionalAddons:
    - nginx-yaml
    version: v2
  config:
    installerTtl: 365
    kubernetesVersion: v1.35.4
    location: sanjose-us
    network:
      cni:
        name: Calico
        version: 3.32.2
      podSubnet: 10.244.0.0/16
      serviceSubnet: 10.96.0.0/12
    nodes:
    - arch: amd64
      hostname: mks-cluster-amd
      operatingSystem: Ubuntu24.04
      privateIP: 10.0.0.206
      roles:
      - ControlPlane
      - Worker
    platformVersion: v1.4.0
  type: mks
