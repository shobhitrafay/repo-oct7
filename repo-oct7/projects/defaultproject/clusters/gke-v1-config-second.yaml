apiVersion: infra.k8smgmt.io/v3
kind: Cluster
metadata:
  labels:
    clusterName: gke-v1-config-second
    clusterType: gke
  name: gke-v1-config-second
  project: defaultproject
spec:
  blueprint:
    name: rishabh-latest-bp
    optionalAddons:
    - simple-addon
    - nginx-yaml
    - hello-addon
    version: v2
  cloudCredentials: shobhit_gcp
  config:
    controlPlaneVersion: "1.35"
    features:
      enableComputeEnginePersistentDiskCSIDriver: true
    gcpProject: dev-382813
    location:
      config:
        zone: us-central1-c
      type: zonal
    network:
      access:
        config: null
        type: public
      enableVPCNativetraffic: true
      maxPodsPerNode: 110
      name: default
      subnetName: default
    nodePools:
    - machineConfig:
        bootDiskSize: 100
        bootDiskType: pd-standard
        imageType: COS_CONTAINERD
        machineType: e2-standard-4
      metadata:
        nodeTaints:
        - effect: NoSchedule
          key: k1
      name: default-nodepool
      nodeVersion: "1.35"
      size: 3
    - machineConfig:
        bootDiskSize: 100
        bootDiskType: pd-standard
        imageType: COS_CONTAINERD
        machineType: e2-standard-4
      name: pool2
      nodeVersion: "1.35"
      size: 3
  type: gke
