apiVersion: infra.k8smgmt.io/v3
kind: Cluster
metadata:
  name: gcp-v1-config-rctl
  project: defaultproject
spec:
  blueprint:
    name: rishabh-latest-bp
    optionalAddons:
    - nginx-yaml
    - hello-addon
    - simple-addon
    version: v2
  cloudCredentials: shobhit_gcp
  config:
    controlPlaneVersion: "1.35"
    features:
      enableComputeEnginePersistentDiskCSIDriver: true
    gcpProject: dev-382813
    location:
      config:
        zone: us-central1-b
      type: zonal
    network:
      access:
        config: null
        type: public
      dataPlaneV2: ADVANCED_DATAPATH
      enableVPCNativetraffic: true
      maxPodsPerNode: 110
      name: default
      subnetName: default
    nodePools:
    - machineConfig:
        bootDiskSize: 100
        bootDiskType: pd-standard
        imageType: COS_CONTAINERD
        machineType: e2-standard-4
      management:
        autoUpgrade: true
      name: default-nodepool
      nodeVersion: "1.35"
      size: 3
      upgradeSettings:
        config:
          maxSurge: 1
        strategy: SURGE
    releaseChannel:
      channel: REGULAR
    security:
      enableWorkloadIdentity: true
  type: gke
