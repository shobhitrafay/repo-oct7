apiVersion: infra.k8smgmt.io/v3
kind: Blueprint
metadata:
  name: new-blueprint
  project: defaultproject
spec:
  base:
    name: minimal
    version: 4.3.1
  customAddons:
  - isOptional: true
    name: hello-addon
    version: ' v2'
  - isOptional: true
    name: nginx-yaml
    version: v1
  defaultAddons:
    monitoring:
      gpuOperator: {}
  driftWebhook:
    enabled: true
  type: custom
  version: v4
  versionState: active
