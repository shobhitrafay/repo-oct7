apiVersion: infra.k8smgmt.io/v3
kind: Blueprint
metadata:
  name: rauto-opa-test-blueprint
  project: defaultproject
spec:
  base:
    name: default
    version: 4.3.1
  defaultAddons:
    enableIngress: true
    enableLocalStorage: true
    enableMonitoring: true
    monitoring:
      gpuOperator: {}
  driftWebhook:
    enabled: true
  opaPolicy:
    opaPolicy:
    - name: rauto-policy-donot-delete
      version: "1"
    profile:
      name: default
      version: latest
  type: custom
  version: "1"
  versionState: active
