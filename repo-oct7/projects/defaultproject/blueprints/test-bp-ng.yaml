apiVersion: infra.k8smgmt.io/v3
kind: Blueprint
metadata:
  name: test-bp-ng
  project: defaultproject
spec:
  base:
    name: default
    version: 4.3.1
  componentsCriticality:
  - name: nginx-web
  customAddons:
  - isOptional: true
    name: hello-addon
    version: v1
  - name: nginx-web
    version: v1
  defaultAddons:
    enableIngress: true
    enableLocalStorage: true
    enableMonitoring: true
    monitoring:
      gpuOperator: {}
  driftWebhook:
    enabled: true
  type: custom
  version: v1
  versionState: draft
