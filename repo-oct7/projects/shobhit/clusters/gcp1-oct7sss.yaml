apiVersion: infra.k8smgmt.io/v3
kind: Cluster
metadata:
  name: gcp1-oct7sss
  project: shobhit
spec:
  blueprint:
    name: sj-bp
    optionalAddons:
    - sj-addon1
    - sj-addon2
    version: v2
  cloudCredentials: shobhit_gcp
  config:
    controlPlaneVersion: "1.34"
    features:
      enableComputeEnginePersistentDiskCSIDriver: true
    gcpProject: dev-382813
    location:
      config:
        zone: us-central1-b
      type: zonal
    network:
      access:
        config: null
        type: public
      dataPlaneV2: ADVANCED_DATAPATH
      enableVPCNativetraffic: true
      maxPodsPerNode: 110
      name: default
      subnetName: default
    nodePools:
    - machineConfig:
        bootDiskSize: 100
        bootDiskType: pd-standard
        imageType: COS_CONTAINERD
        machineType: e2-standard-4
      management:
        autoUpgrade: true
      name: default-nodepool
      nodeVersion: "1.34"
      security:
        workloadMetadataMode: gke_metadata
      size: 3
      upgradeSettings:
        config:
          maxSurge: 1
        strategy: SURGE
    releaseChannel:
      channel: REGULAR
    security:
      enableWorkloadIdentity: true
  type: gke
