apiVersion: infra.k8smgmt.io/v3
kind: Cluster
metadata:
  name: deepan-mks-oct8
  project: shobhit
spec:
  blueprint:
    name: minimal
  config:
    autoApproveNodes: true
    installerTtl: 365
    kubernetesVersion: v1.36.4
    network:
      cni:
        name: Calico
        version: 3.32.2
      podSubnet: 10.244.0.0/16
      serviceSubnet: 10.96.0.0/12
    nodes:
    - arch: amd64
      hostname: ip-172-31-11-159
      operatingSystem: Ubuntu22.04
      privateIP: 172.31.11.159
      roles:
      - Worker
      - ControlPlane
    platformVersion: v1.4.0
  proxy: {}
  type: mks
