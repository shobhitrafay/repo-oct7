apiVersion: infra.k8smgmt.io/v3
kind: Cluster
metadata:
  labels:
    type: mks
  name: mks-cluster-from-rctl
  project: shobhit
spec:
  blueprint:
    name: minimal
    version: latest
  config:
    autoApproveNodes: true
    kubernetesVersion: v1.34.7
    location: sanjose-us
    network:
      cni:
        name: Calico
        version: 3.31.4
      podSubnet: 10.244.0.0/16
      serviceSubnet: 10.96.0.0/12
    nodes:
    - arch: amd64
      hostname: ip-172-31-1-35
      operatingSystem: Ubuntu22.04
      privateIP: 172.31.1.35
      roles:
      - ControlPlane
      - Worker
      ssh:
        ipAddress: 100.54.107.232
  type: mks
