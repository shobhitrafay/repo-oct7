apiVersion: infra.k8smgmt.io/v3
kind: Cluster
metadata:
  labels:
    awsaccountid: demo_id
    awsacmid: demo_id
    env: devops
    hostedzoneid: demo_id
    region: us-west-2
  name: demo22-cluster-shobhit
  project: shobhit
spec:
  blueprintConfig:
    name: sj-bp
    optionalAddons:
    - sj-addon1
    version: v2
  cloudCredentials: shobhit_azure
  config:
    kind: aksClusterConfig
    metadata:
      name: rauro-import2
    spec:
      managedCluster:
        apiVersion: "2023-11-01"
        identity:
          type: SystemAssigned
        location: centralindia
        properties:
          addonProfiles:
            azureKeyvaultSecretsProvider:
              config:
                enableSecretRotation: "false"
              enabled: false
            azurePolicy:
              enabled: false
          apiServerAccessProfile:
            enablePrivateCluster: false
            enablePrivateClusterPublicFQDN: false
          autoUpgradeProfile:
            nodeOsUpgradeChannel: None
            upgradeChannel: none
          disableLocalAccounts: false
          dnsPrefix: rauro-import2-dns
          enableRBAC: true
          identityProfile:
            kubeletIdentity:
              resourceId: /subscriptions/a2252eb2-7a25-432b-a5ec-e18eba6f26b1/resourcegroups/MC_shobhit-rg_rauro-import2_centralindia/providers/Microsoft.ManagedIdentity/userAssignedIdentities/rauro-import2-agentpool
          kubernetesVersion: 1.35.8
          networkProfile:
            dnsServiceIP: 10.0.0.10
            loadBalancerSku: standard
            networkDataplane: azure
            networkPlugin: azure
            networkPluginMode: overlay
            networkPolicy: none
            podCidr: 10.244.0.0/16
            serviceCidr: 10.0.0.0/16
          nodeProvisioningProfile:
            mode: Manual
          nodeResourceGroup: MC_shobhit-rg_rauro-import2_centralindia
          oidcIssuerProfile:
            enabled: true
          powerState:
            code: Running
          securityProfile:
            workloadIdentity:
              enabled: true
          windowsProfile:
            adminUsername: azureuser
            enableCSIProxy: true
        sku:
          name: Base
          tier: Free
        type: Microsoft.ContainerService/managedClusters
      nodePools:
      - apiVersion: "2023-11-01"
        name: agentpool
        properties:
          count: 4
          enableAutoScaling: true
          maxCount: 10
          maxPods: 110
          minCount: 4
          mode: System
          nodeImageVersion: AKSUbuntu-2404gen2containerd-202610.03.0
          orchestratorVersion: 1.35.8
          osDiskSizeGB: 128
          osType: Linux
          type: VirtualMachineScaleSets
          upgradeSettings:
            maxSurge: 10%
          vmSize: Standard_DS2_v2
        type: Microsoft.ContainerService/managedClusters/agentPools
      resourceGroupName: shobhit-rg
  type: aks
